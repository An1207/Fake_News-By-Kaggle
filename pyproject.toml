[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "sai-news-ai"
version = "0.1.0"
description = "Leakage-aware fake news classification and local LLM summarization"
requires-python = ">=3.11,<3.14"
dependencies = [
  "pandas>=2.2,<3",
  "numpy>=2,<3",
  "scikit-learn>=1.6,<2",
  "joblib>=1.4,<2",
  "streamlit>=1.45,<2",
  "kagglehub>=0.3,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]
web = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "pymysql[rsa]>=1.1,<2",
  "pydantic-settings>=2.7,<3",
  "alembic>=1.14,<2",
]

[project.scripts]
news-ai = "news_ai.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/news_ai", "src/news_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
